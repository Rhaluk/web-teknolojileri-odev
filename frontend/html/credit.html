<div id="credit-container" class="centered">
    <h3 id="selam">merhaba</h3>
    <!-- Sayfa açılışında replikadan okunur. Yüklemeden sonra ise
         procedure'ün kaynaktan döndürdüğü bakiye yazılır. -->
    <p>mevcut krediniz <strong id="bakiye" class="fiyat"></strong></p>

    <div>
        <h3> kredi yükle</h3>

        <!-- Sonuç ya da procedure hatası buraya yazılır
             (ör. "Yükleme tutarı 10 ile 1000 TL arasında olmalıdır.") -->
        <p id="yukleme-mesaj" class="bildirim bildirim-hata" role="alert" hidden></p>

        <form id="yukleme-formu">
            <fieldset id="hizli-tutar">
                <legend>hızlı seçim</legend>
                <input type="radio" id="tutar-50" name="hizli" value="50">
                <label for="tutar-50">50 TL</label>
                <input type="radio" id="tutar-100" name="hizli" value="100" checked>
                <label for="tutar-100">100 TL</label>
                <input type="radio" id="tutar-200" name="hizli" value="200">
                <label for="tutar-200">200 TL</label>
                <input type="radio" id="tutar-500" name="hizli" value="500">
                <label for="tutar-500">500 TL</label>
            </fieldset>

            <label for="tutar">tutar (TL)</label>
            <input id="tutar" name="tutar" type="number" min="10" max="1000" step="0.01" value="100" inputmode="decimal">
            <p class="soluk">Tek seferde 10 ile 1000 TL arası yüklenebilir.</p>

            <button type="submit" class="dugme">yükle</button>
        </form>
    </div>

    <div>
        <h3>
            geçmiş hareketler
        </h3>

        <table class="tablo tablo-kart" id="hareketler">
            <thead>
            <tr>
                <th>tarih</th>
                <th>açıklama</th>
                <th>tutar</th>
            </tr>
            </thead>
            <tbody>
            <!-- satırlar /api/bakiye'den doldurulur -->
            </tbody>
        </table>
    </div>


</div>
<script type="module" src="../js/credit.js"></script>
</body>
</html>
