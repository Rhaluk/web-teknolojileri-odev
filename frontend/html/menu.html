<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Haftanın Menüsü · Yemekhane</title>

    <link rel="stylesheet" href="../css/temel.css">
    <link rel="stylesheet" href="../css/menu.css">
</head>
<body>
<header>
    <nav>
        <ul>
            <li><a href="index.html">günün menüsü</a></li>
            <li><a href="menu.html" aria-current="page">haftanın menüsü</a></li>
            <li><a href="rezervations.html">rezervasyonlarım</a></li>
            <li><a href="credit.html">bakiye</a></li>
            <li><a href="rate.html">puan verin</a></li>
            <li><a href="adminPanel.html">yönetici</a></li>
            <li><a href="profil.html">profil</a></li>
            <li><a href="login.html" id="cikis">çıkış</a></li>
        </ul>

    </nav>
</header>
<main class="centered">
    <h1 class="small-centered-header">Haftanın menüsü</h1>

    <form id="yemekhane-secim">
        <label for="yemekhane">Yemekhane</label>
        <!-- seçenekler /api/yemekhaneler'den doldurulur -->
        <select id="yemekhane" name="yemekhane_id"></select>
    </form>

    <!-- Önceki / sonraki hafta -->
    <div id="hafta-gezinti">
        <button type="button" class="dugme dugme-ikincil" id="onceki-hafta" aria-label="Önceki hafta">‹ önceki</button>
        <span id="hafta-araligi"></span>
        <button type="button" class="dugme dugme-ikincil" id="sonraki-hafta" aria-label="Sonraki hafta">sonraki ›</button>
    </div>

    <!-- Rezervasyon sonucu ya da procedure hatası buraya yazılır
         (ör. "Bakiye yetersiz.", "Yemekhane kapasitesi dolu.") -->
    <p id="rezervasyon-mesaj" class="bildirim bildirim-hata" role="alert" hidden></p>

    <!-- Fiyat kullanıcının rolüne göre API'den gelir; son saat geçtiyse düğme pasif -->
    <table id="weekly-menu-table" class="tablo-kart">
        <thead>
        <tr>
            <th>Gün</th>
            <th>Öğün</th>
            <th>Yemekler</th>
            <th>Kcal</th>
            <th>Fiyat</th>
            <th>boş yer sayısı</th>
            <th>rezervasyon yap</th>
        </tr>
        </thead>
        <!-- satırlar /api/menuler/haftalik'ten doldurulur -->
        <tbody></tbody>
    </table>

    <p id="hafta-bos" class="soluk" hidden>Bu hafta için menü yok.</p>
</main>
<script type="module" src="../js/menu.js"></script>
</body>
</html>
