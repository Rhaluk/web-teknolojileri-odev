<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Günün Menüsü · Yemekhane</title>
    <link rel="stylesheet" href="../css/temel.css">
    <link rel="stylesheet" href="../css/index.css">
</head>
<body>
<header>
    <nav>
        <ul>
            <li><a href="index.html" aria-current="page">günün menüsü</a></li>
            <li><a href="menu.html">haftanın menüsü</a></li>
            <li><a href="rezervations.html">rezervasyonlarım</a></li>
            <li><a href="credit.html">bakiye</a></li>
            <li><a href="rate.html">puan verin</a></li>
            <li><a href="adminPanel.html">yönetici</a></li>
            <li><a href="profil.html">profil</a></li>
            <li><a href="login.html" id="cikis">çıkış</a></li>
        </ul>
    </nav>
</header>

<main class="centered">
    <h1 class="small-header" id="sayfa-baslik">Günün menüsü</h1>

    <!-- Yemekhane, tarih ve öğün seçimi. Değişince menü API'den yeniden istenir. -->
    <form id="menu-secim">
        <div class="alan">
            <label for="yemekhane">Yemekhane</label>
            <!-- seçenekler /api/yemekhaneler'den doldurulur -->
            <select id="yemekhane" name="yemekhane_id"></select>
        </div>

        <div class="alan">
            <label for="tarih">Tarih</label>
            <input type="date" id="tarih" name="tarih">
        </div>

        <fieldset class="alan">
            <legend>Öğün</legend>
            <div class="ogun-secim">
                <input type="radio" id="ogun-1" name="ogun_id" value="1">
                <label for="ogun-1">Kahvaltı</label>
                <input type="radio" id="ogun-2" name="ogun_id" value="2" checked>
                <label for="ogun-2">Öğle</label>
                <input type="radio" id="ogun-3" name="ogun_id" value="3">
                <label for="ogun-3">Akşam</label>
            </div>
        </fieldset>
    </form>

    <!-- Yükleme ya da API hatası buraya yazılır -->
    <p id="menu-hata" class="bildirim bildirim-hata" role="alert" hidden></p>

    <!-- Yemekler kategori sırasıyla gelir (v_menu_detay: ORDER BY kategori_sira, yemek) -->
    <!-- Aşama 4: menüde profildeki alerjenlerden biri varsa -->
    <p id="alerjen-uyari" class="bildirim bildirim-uyari" role="status" hidden></p>

    <section id="gunun-menusu" hidden>
        <ul id="yemek-listesi"></ul>

        <div id="menu-ozet">
            <p>Toplam <strong id="toplam-kalori"></strong> · <span id="fiyat" class="fiyat"></span><span id="yarim-fiyat" class="soluk"></span> · <span id="bos-yer"></span> boş yer</p>
            <a class="dugme" href="menu.html">rezervasyon yap</a>
        </div>
    </section>

    <!-- Seçilen yemekhane ve öğün için menü yoksa liste yerine bu gösterilir -->
    <p id="menu-yok" class="soluk" hidden>Bu öğün için menü yok.</p>
</main>
<script type="module" src="../js/index.js"></script>
</body>
</html>
