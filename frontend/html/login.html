<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Giriş · Yemekhane</title>
    <link rel="stylesheet" href="../css/temel.css">
</head>
    <body>
        <!-- Giriş yapmamış kullanıcı diğer sayfalara gidemeyeceği için
             burada menü bağlantıları yok, yalnızca site adı var. -->
        <header>
            <p class="site-adi">Yemekhane</p>
        </header>

        <div id="login-div">
            <h1 class="small-header">Hesabına giriş yap</h1>

            <!-- API'den dönen hata mesajı buraya yazılır (ör. "E-posta ya da şifre hatalı.") -->
            <p id="giris-hata" class="bildirim bildirim-hata" role="alert" hidden></p>

            <form id="giris-formu">
                <!-- label ekranda görünmüyor ama ekran okuyucu alanın adını okuyabiliyor -->
                <label for="eposta" class="gorunmez">E-posta</label>
                <input id="eposta" name="eposta" type="email" placeholder="E-posta"
                       autocomplete="username" required>

                <label for="sifre" class="gorunmez">Şifre</label>
                <input id="sifre" name="sifre" type="password" placeholder="Şifre"
                       autocomplete="current-password" required>

                <button type="submit">Giriş Yap</button>
            </form>
        </div>
        <script type="module" src="../js/login.js"></script>
    </body>
</html>
